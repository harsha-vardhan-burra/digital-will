spring.application.name=digital-will-backend-test

# Use in-memory H2 with PostgreSQL compatibility mode for tests
spring.datasource.url=jdbc:h2:mem:digitalwilldb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Flyway migrations run on H2 for testing
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Actuator Endpoints (Restricted to health and info only, details hidden)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Server Error Handling
server.error.include-stacktrace=never
server.error.include-message=never

# Rate Limiting: Enabled with reasonable threshold for tests
digitalwill.ratelimit.enabled=true
digitalwill.ratelimit.auth-limit=10
digitalwill.ratelimit.verification-limit=10
digitalwill.ratelimit.disclosure-limit=10
digitalwill.ratelimit.window-seconds=60

# Test routes enabled for GlobalExceptionHandlerTest
security.test-routes.enabled=true

# Test CORS
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173
