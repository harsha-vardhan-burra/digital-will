spring.application.name=digital-will-backend

# Database Configuration (PostgreSQL / Supabase)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/digitalwill}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway Migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Actuator Endpoints (Restricted to health and info only, details hidden)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Server Error Handling (Never leak stack traces)
server.error.include-stacktrace=never
server.error.include-message=never

# Rate Limiting & Abuse Controls (Workstream 7)
digitalwill.ratelimit.enabled=true
digitalwill.ratelimit.auth-limit=5
digitalwill.ratelimit.verification-limit=10
digitalwill.ratelimit.disclosure-limit=10
digitalwill.ratelimit.window-seconds=60

# CORS Allowed Origins
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173

# Test Routes Disabled in Production
security.test-routes.enabled=false
