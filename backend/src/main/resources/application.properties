spring.application.name=digital-will-backend

# Server Configuration
server.port=${SERVER_PORT:8080}

# Database Configuration (PostgreSQL / Supabase)
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://localhost:5432/digitalwill}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:postgres}}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.pool-name=DigitalWillHikariPool

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# Flyway Database Migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# Cryptographic Master Key & Storage
digitalwill.crypto.master-key=${APP_CRYPTO_MASTER_KEY:${DIGITALWILL_CRYPTO_MASTER_KEY:k8vS4w1bY8Z3tqX9LmP0rTuVwXyZ1234567890ABCDE=}}
digitalwill.crypto.storage-directory=${APP_CRYPTO_STORAGE_DIR:${DIGITALWILL_CRYPTO_STORAGE_DIRECTORY:./storage/documents}}

# Internal Scheduled Job Secret
digitalwill.jobs.secret=${APP_JOBS_SECRET:${DIGITALWILL_JOBS_SECRET:digitalwill-internal-secret-token}}

# Actuator Endpoints (Restricted to health and info only, details hidden)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Server Error Handling (Never leak stack traces)
server.error.include-stacktrace=never
server.error.include-message=never

# Rate Limiting & Abuse Controls (Workstream 7)
digitalwill.ratelimit.enabled=true
digitalwill.ratelimit.auth-limit=5
digitalwill.ratelimit.verification-limit=10
digitalwill.ratelimit.disclosure-limit=10
digitalwill.ratelimit.window-seconds=60

# CORS Allowed Origins
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173

# Test Routes Disabled in Production
security.test-routes.enabled=false

# Internal Job Processing Configuration (Workstream 2)
digitalwill.jobs.secret=${APP_JOBS_SECRET:digitalwill-internal-secret-token}

# Notification Delivery Configuration (Workstream 3)
digitalwill.notifications.enabled=${NOTIFICATIONS_ENABLED:false}
digitalwill.notifications.provider=${NOTIFICATIONS_PROVIDER:DISABLED}
digitalwill.notifications.from-email=${NOTIFICATIONS_FROM_EMAIL:notifications@digitalwill.local}
digitalwill.notifications.frontend-base-url=${APP_FRONTEND_URL:http://localhost:3000}
digitalwill.notifications.api-key=${NOTIFICATIONS_API_KEY:}

