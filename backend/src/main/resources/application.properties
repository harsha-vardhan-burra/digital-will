spring.application.name=digital-will-backend

# Server
server.port=${SERVER_PORT:8080}

# Database (PostgreSQL / Supabase)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/digitalwill}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.pool-name=DigitalWillHikariPool

# JPA / Hibernate (schema is owned by Flyway)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Cryptography (required: no defaults, the app must not start without them)
digitalwill.crypto.master-key=${APP_CRYPTO_MASTER_KEY}
digitalwill.crypto.storage-directory=${APP_CRYPTO_STORAGE_DIR:./storage/documents}

# Internal scheduled job secret (required)
digitalwill.jobs.secret=${APP_JOBS_SECRET}

# Multipart upload limits
spring.servlet.multipart.max-file-size=${APP_UPLOAD_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${APP_UPLOAD_MAX_REQUEST_SIZE:12MB}

# Actuator (health and info only)
management.endpoints.web.exposure.include=health,info

# Rate limiting and abuse controls
digitalwill.ratelimit.enabled=true
digitalwill.ratelimit.auth-limit=5
digitalwill.ratelimit.verification-limit=10
digitalwill.ratelimit.disclosure-limit=10
digitalwill.ratelimit.window-seconds=60

# CORS
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# Test routes must stay disabled outside tests
security.test-routes.enabled=false

# Notifications
digitalwill.notifications.enabled=${NOTIFICATIONS_ENABLED:false}
digitalwill.notifications.provider=${NOTIFICATIONS_PROVIDER:DISABLED}
digitalwill.notifications.from-email=${NOTIFICATIONS_FROM_EMAIL:notifications@digitalwill.local}
digitalwill.notifications.frontend-base-url=${APP_FRONTEND_URL:http://localhost:3000}
digitalwill.notifications.api-key=${NOTIFICATIONS_API_KEY:}

# Antivirus scanner
digitalwill.scanner.enabled=${SCANNER_ENABLED:true}
digitalwill.scanner.host=${SCANNER_HOST:localhost}
digitalwill.scanner.port=${SCANNER_PORT:3310}
digitalwill.scanner.timeout-ms=${SCANNER_TIMEOUT_MS:5000}
digitalwill.scanner.mode=${SCANNER_MODE:OPTIONAL}

# Jackson: reject unknown properties
spring.jackson.deserialization.fail-on-unknown-properties=true