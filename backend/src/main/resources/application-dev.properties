spring.application.name=digital-will-backend-dev

# Server Configuration
server.port=${SERVER_PORT:8080}

# Local Dev In-Memory Database (H2 with PostgreSQL compatibility mode)
# Provides zero-dependency instant startup for local development and UI integration
spring.datasource.url=jdbc:h2:mem:digitalwill;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Flyway Migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# Cryptographic Master Key & Storage
digitalwill.crypto.master-key=${APP_CRYPTO_MASTER_KEY:${DIGITALWILL_CRYPTO_MASTER_KEY:k8vS4w1bY8Z3tqX9LmP0rTuVwXyZ1234567890ABCDE=}}
digitalwill.crypto.storage-directory=${APP_CRYPTO_STORAGE_DIR:${DIGITALWILL_CRYPTO_STORAGE_DIRECTORY:./storage/documents}}

# Internal Scheduled Job Secret
digitalwill.jobs.secret=${APP_JOBS_SECRET:${DIGITALWILL_JOBS_SECRET:digitalwill-internal-secret-token}}

# Actuator Endpoints
management.endpoints.web.exposure.include=health,info
